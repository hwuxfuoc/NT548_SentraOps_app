name: CD - Main Branch

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@48aba3b46827ffe4e3906cf93cc3c46aeabb7e88  # v6.5.0
        with:
          context: .
          push: false  # chưa push, scan trước
          tags: |
            ghcr.io/hwuxfuoc/sentraops-app:${{ github.sha }}
            ghcr.io/hwuxfuoc/sentraops-app:latest
          load: true  # load vào Docker daemon để Trivy scan được

      - name: Trivy - image scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: ghcr.io/hwuxfuoc/sentraops-app:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: |
          docker push ghcr.io/hwuxfuoc/sentraops-app:${{ github.sha }}
          docker push ghcr.io/hwuxfuoc/sentraops-app:latest