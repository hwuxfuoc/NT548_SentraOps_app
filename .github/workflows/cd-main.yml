name: CD - Main Branch

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # chưa push, scan trước
          tags: |
            ghcr.io/hwuxfuoc/sentraops-app:${{ github.sha }}
            ghcr.io/hwuxfuoc/sentraops-app:latest
          load: true  # load vào Docker daemon để Trivy scan được

      - name: Trivy - image scan
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ghcr.io/hwuxfuoc/sentraops-app:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: |
          docker push ghcr.io/hwuxfuoc/sentraops-app:${{ github.sha }}
          docker push ghcr.io/hwuxfuoc/sentraops-app:latest

  bump-gitops:
    name: Bump GitOps Tag
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Clone gitops repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          git clone https://x-access-token:${GITOPS_PAT}@github.com/hwuxfuoc/NT548_SentraOps_gitops.git gitops

      - name: Update image tag
        run: |
          cd gitops
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" dev/values.yaml
          cat dev/values.yaml

      - name: Commit and push
        run: |
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dev/values.yaml
          git diff --staged --quiet || git commit -m "ci: bump sentraops-app to ${{ github.sha }}"
          git push