name: CI — Pull Request

on:
  pull_request:
    branches: [main]

# Hủy run cũ nếu có run mới trên cùng PR
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu
permissions:
  contents: read

jobs:
  # Tuần 1: lint + unit test + build image (chưa push)
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Lint
        run: pip install ruff && ruff check app/

      - name: Unit tests
        run: pip install pytest && pytest tests/ -v

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build Docker image
        run: docker build -t sentraops-app:${{ github.sha }} .

  # Tuần 2: security gates — sẽ thêm vào part tiếp theo
  # - Gitleaks (secret scanning)
  # - Semgrep (SAST)
  # - Trivy (dependency + IaC)
